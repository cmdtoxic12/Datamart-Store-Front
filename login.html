<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - C-LICON</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="auth-body">
    <div class="auth-card">
      <h1>C-LICON DATA BANK</h1>
      <p id="authSubtitle">Login to continue</p>

      <div class="auth-tabs">
        <button id="loginTab" class="active" onclick="setAuthMode('login')">
          Login
        </button>
        <button id="signupTab" onclick="setAuthMode('signup')">Signup</button>
      </div>

      <input id="email" type="email" placeholder="Email" />
      <input id="password" type="password" placeholder="Password" />

      <input
        id="confirmPassword"
        type="password"
        placeholder="Confirm Password"
        class="hidden"
      />

      <button id="authActionBtn" onclick="login()">Login</button>

      <button id="googleLoginBtn" onclick="googleLogin()">
        <i class="fa-brands fa-google"></i> Continue with Google
      </button>

      <p id="authMessage"></p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>

    <div id="toastBox"></div>
  </body>
</html>
